version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: repolease-db
    environment:
      POSTGRES_USER: repolease
      POSTGRES_PASSWORD: repolease_secret
      POSTGRES_DB: repolease
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: repolease-redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
